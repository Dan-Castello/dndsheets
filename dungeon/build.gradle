plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = '1.0.0'
group = 'net.hawthorn.dndsheets.dungeon'
archivesBaseName = 'dndsheets-dungeon'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('runClient')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                // The addon doesn't start on its own — it needs the core loaded in the same development
                // client. A direct source of the root project's sourceSet, not the published jar:
                // this way a change in either module shows up without having to compile the other.
                dndsheets {
                    source project(':').sourceSets.main
                }
                dndsheets_dungeon {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('runServer')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                dndsheets {
                    source project(':').sourceSets.main
                }
                dndsheets_dungeon {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.22'

    // HARD dependency on the core: the dungeon toolkit isn't really an independent mod,
    // it only touches three things of the core (DndsheetsMod.LOGGER/PRETTY_GSON/MODID, DndPaths, TomeButton) and
    // extends its shared GUI framework (SmallFormScreen/ListPickerScreen/ModalDialogScreen/
    // GuiStyle). It compiles against the root project's sourceSet, not a separately published jar.
    implementation project(':')
}

jar {
    archiveClassifier = ''
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Same pattern as the core (see the root build.gradle): pure logic (DungeonManager.buildPoolJsons,
// GridToStructure) tested standing up, without the Forge runtime.
tasks.register('testDungeonSelf', JavaExec) {
    dependsOn compileTestJava
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.hawthorn.dndsheets.dungeon.DungeonSelfTest'
    workingDir = rootDir
}

check.dependsOn testDungeonSelf
