modLoader="javafml"
loaderVersion="[47,)"
license="MIT License"

[[mods]]
modId="dndsheets_species"
version="1.0.0"
displayName="VTT MineRPG: Species"
authors="Hawthorn, Cosmic"
description="Aplica el Aumento de Caracteristica y los rasgos del SRD cuando el jugador elige su raza con Origins."

[[dependencies.dndsheets_species]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1]"
    ordering="NONE"
    side="BOTH"

# Dependencia DURA a proposito (ver Modularity Map / Library Audit): sin el core no hay a que ficha
# aplicarle nada.
[[dependencies.dndsheets_species]]
    modId="dndsheets"
    mandatory=true
    versionRange="[2.2.0,)"
    ordering="AFTER"
    side="BOTH"

# HARD dependency on purpose: Origins is what picks the race. Without it installed, /dndspecies sync has
# nothing to read from and fails with a clear message (see RaceOriginBridge), not silently.
[[dependencies.dndsheets_species]]
    modId="origins"
    mandatory=true
    versionRange="[1.10.0,)"
    ordering="AFTER"
    side="BOTH"
