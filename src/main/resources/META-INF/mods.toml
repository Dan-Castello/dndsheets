modLoader="javafml"
loaderVersion="[47,)"
license="MIT License"

[[mods]]
modId="dndsheets"
# ${file.jarVersion} is replaced by Forge at startup with the jar's version, which comes from build.gradle.
# It used to be a hand-typed number, and that is exactly why the repo said 1.0.2 while CurseForge
# had a published 1.0.3: two places you have to remember to touch at the same time.
version="${file.jarVersion}"
displayName="VTT MineRPG"
authors="Hawthorn, Cosmic"
logoFile="logo.png"
description="A mod to let you play D&D 5e in Minecraft."

[[dependencies.dndsheets]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1]"
    ordering="NONE"
    side="BOTH"





# HARD dependency: if Curios is present, magic items use its real slots (ring,
# necklace, cape, belt) instead of relying on attunement alone; if it isn't, the mod works
# exactly as before. mandatory=true makes Forge refuse to start without it.
[[dependencies.dndsheets]]
    modId="curios"
    mandatory=true
    versionRange="[5,)"
    ordering="AFTER"
    side="BOTH"

# HARD dependency: with Patchouli installed, the Guide opens as a manual with an index, search and
# bookmarks, and it also becomes an item the player can keep. Without it, the usual written book
# opens with the same pages. See PatchouliCompat.
[[dependencies.dndsheets]]
    modId="patchouli"
    mandatory=true
    versionRange="[1.20.1-84,)"
    ordering="AFTER"
    side="BOTH"

# HARD dependency: with Jade installed, pointing at a creature shows its AC, HP and conditions
# on the HUD, without opening anything. Without it, nothing extra appears and everything else works the same. See JadePlugin,
# which is the only class in the mod that names Jade types and the only one loaded by Jade itself.
[[dependencies.dndsheets]]
    modId="jade"
    mandatory=true
    versionRange="[11,)"
    ordering="AFTER"
    side="BOTH"

# HARD dependency: with Pehkui installed, each creature is drawn at the size its block declares
# (Tiny to Gargantuan) — 149 of the bestiary's 330 are larger than Medium. Without it, all of them look
# the way they always have. See PehkuiCompat.
[[dependencies.dndsheets]]
    modId="pehkui"
    mandatory=true
    versionRange="[3,)"
    ordering="AFTER"
    side="BOTH"

# ---- Bundled addons: CurseForge allows one file per project, so they ship inside this jar ----

[[mods]]
modId="dndsheets_dungeon"
version="${file.jarVersion}"
displayName="VTT MineRPG: Dungeon Toolkit"
authors="Hawthorn, Cosmic"
description="DM tools to draw and generate 5e dungeons. Bundled with VTT MineRPG."

[[dependencies.dndsheets_dungeon]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1]"
    ordering="NONE"
    side="BOTH"

[[mods]]
modId="dndsheets_species"
version="${file.jarVersion}"
displayName="VTT MineRPG: Species"
authors="Hawthorn, Cosmic"
description="Applies the SRD Ability Score Increase and traits when the player picks their race with Origins."

[[dependencies.dndsheets_species]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1]"
    ordering="NONE"
    side="BOTH"

# HARD dependency: Origins is what picks the race (see RaceOriginBridge).
[[dependencies.dndsheets_species]]
    modId="origins"
    mandatory=true
    versionRange="[1.10.0,)"
    ordering="AFTER"
    side="BOTH"

# Origins:Classes ships data/origins-classes/origin_layers/class.json at the SAME path we replace with the 12 SRD
# classes; AFTER makes ours win. Optional.
[[dependencies.dndsheets_species]]
    modId="origins_classes"
    mandatory=false
    versionRange="[1.2.0,)"
    ordering="AFTER"
    side="BOTH"
