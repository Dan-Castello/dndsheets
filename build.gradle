plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = '1.0.2'
group = 'net.hawthorn.dndsheets'
archivesBaseName = 'dndsheets'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'


    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('runClient')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                dndsheets {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('runServer')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                dndsheets {
                    source sourceSets.main
                }
            }
        }
    }
}

configurations {
    shade
    implementation.extendsFrom shade
}

repositories {
    // Curios API. Dependencia BLANDA: solo compileOnly, nunca se empaqueta ni se exige en runtime — el
    // mod arranca y funciona igual sin Curios instalado (ver CuriosCompat y la entrada opcional de
    // mods.toml). Si este maven estuviera caido, lo unico que se rompe es compilar, no el mod publicado.
    maven { url = "https://maven.theillusivec4.top/" }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    // https://mvnrepository.com/artifact/io.github.tfriedrichs/dicebot
    minecraftLibrary 'io.github.tfriedrichs:dicebot:1.0.0'
    shade 'io.github.tfriedrichs:dicebot:1.0.0'

    // El clasificador "api" en vez del jar completo: es lo unico que se necesita para compilar contra
    // Curios, y deja claro que no se depende de su implementacion.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api")
    // El jar completo SOLO en el entorno de desarrollo, para poder probar la integracion de verdad en
    // runClient. No entra en el jar publicado ni en las dependencias del mod.
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")
}

jar {
    archiveClassifier = 'slim'

}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    relocate 'io.github.tfriedrichs.dicebot', "${project.group}.relocated.dicebot"
    finalizedBy 'reobfShadowJar'
}

assemble.dependsOn shadowJar

reobf {
    shadowJar {}
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}


// Comprueba que los JSON de ejemplo en test/dndsheets/ siguen siendo compatibles con los parsers
// reales del mod (ver JsonContentSelfTest). No usa el runtime de Forge, así que corre fuera del juego.
tasks.register('testJsonContent', JavaExec) {
    dependsOn compileTestJava
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.hawthorn.dndsheets.JsonContentSelfTest'
    workingDir = rootDir
}

check.dependsOn testJsonContent
