plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = '1.0.2'
group = 'net.hawthorn.dndsheets'
archivesBaseName = 'dndsheets'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'


    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('runClient')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                dndsheets {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('runServer')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                dndsheets {
                    source sourceSets.main
                }
            }
        }
    }
}

configurations {
    shade
    implementation.extendsFrom shade
}

repositories {
    // Curios API. Dependencia BLANDA: solo compileOnly, nunca se empaqueta ni se exige en runtime — el
    // mod arranca y funciona igual sin Curios instalado (ver CuriosCompat y la entrada opcional de
    // mods.toml). Si este maven estuviera caido, lo unico que se rompe es compilar, no el mod publicado.
    maven { url = "https://maven.theillusivec4.top/" }

    // Patchouli. Misma clase de dependencia que Curios: BLANDA y solo compileOnly. Es el mod estandar
    // para manuales dentro del juego, y la Guia de este mod es exactamente eso. Sin el instalado, la
    // Guia sigue abriendose en el libro escrito de siempre (ver PatchouliCompat).
    maven { url = "https://maven.blamejared.com" }
}

dependencies {
    // 47.4.22 y no 47.2.0: varios mods que se usan para probar la integracion (FTB Library, Easy NPC,
    // Carry On Extend) exigen 47.3+ o 47.4+, y con 47.2.0 el cliente de desarrollo ni arranca. Es la
    // misma 1.20.1; mods.toml no pide ninguna version de Forge, asi que esto no cambia lo que exige el
    // mod publicado, solo con que se compila y se prueba.
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.22'
    // https://mvnrepository.com/artifact/io.github.tfriedrichs/dicebot
    minecraftLibrary 'io.github.tfriedrichs:dicebot:1.0.0'
    shade 'io.github.tfriedrichs:dicebot:1.0.0'

    // El clasificador "api" y no el jar completo: es lo unico que hace falta para compilar contra Curios,
    // y deja claro que no se depende de su implementacion. Se fija una version TEMPRANA de la 5.x a
    // proposito: los dos metodos que se usan (CuriosApi.getCuriosInventory y getEquippedCurios) existen
    // desde el principio, y compilar contra la mas antigua es lo que hace que el mod funcione con
    // cualquier Curios que el usuario tenga instalado, no solo con el ultimo.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.4.7+1.20.1:api")

    // Solo el artefacto "api", que es lo unico que se toca: PatchouliAPI.get().
    compileOnly fg.deobf("vazkii.patchouli:Patchouli:1.20.1-85-FORGE:api")

    // NO se anade el jar completo como runtimeOnly, aunque seria comodo para probar la integracion:
    // Curios se publica con sus mixins referenciando nombres SRG (f_19803_), y runClient corre con
    // mapeos parchment, donde ese nombre no existe. El resultado es que el cliente de desarrollo no
    // arranca — probado con 5.14.1 y con 5.4.7, asi que no es desfase de version sino el remapeo del
    // entorno. Hacerlo funcionar exigiria configurar el remapeo de refmaps de mixin, y lo unico que
    // compraria es poder probar Curios en local: la integracion en si esta aislada de forma estructural
    // (ver CuriosCompat) y se verifica con javap, no ejecutandola. Para probarla de verdad, instalacion
    // real, no entorno de desarrollo.
}

jar {
    archiveClassifier = 'slim'

}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    relocate 'io.github.tfriedrichs.dicebot', "${project.group}.relocated.dicebot"
    finalizedBy 'reobfShadowJar'
}

assemble.dependsOn shadowJar

reobf {
    shadowJar {}
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}


// Comprueba que los JSON de ejemplo en test/dndsheets/ siguen siendo compatibles con los parsers
// reales del mod (ver JsonContentSelfTest). No usa el runtime de Forge, así que corre fuera del juego.
tasks.register('testJsonContent', JavaExec) {
    dependsOn compileTestJava
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.hawthorn.dndsheets.JsonContentSelfTest'
    workingDir = rootDir
}

check.dependsOn testJsonContent
