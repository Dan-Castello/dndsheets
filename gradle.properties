org.gradle.jvmargs=-Xmx3G
# Gradle 8.1.1 no puede correr sobre Java 21 (soporte agregado recién en Gradle 8.5+). Si tu PATH
# apunta a un Java más nuevo, fija un JDK 17 en TU ~/.gradle/gradle.properties con
# org.gradle.java.home=<ruta a tu jdk-17> — nunca aquí: una ruta absoluta versionada rompe el build
# en cualquier otra máquina. Coincide con java.toolchain.languageVersion=17 de build.gradle.
# Desactivado para evitar que un daemon de Gradle colgado mantenga bloqueados los .jar/.class de
# build/ en Windows entre ejecuciones (ForgeGradle reobfusca y reempaqueta el jar en cada build).
org.gradle.daemon=false