org.gradle.jvmargs=-Xmx3G
# Gradle 8.1.1 no puede correr sobre Java 21 (soporte agregado recién en Gradle 8.5+); fija JDK 17
# explícitamente sin depender de qué versión esté activa en el PATH del sistema. Coincide con
# java.toolchain.languageVersion=17 de build.gradle.
org.gradle.java.home=C:/Program Files/Java/jdk-17
# Desactivado para evitar que un daemon de Gradle colgado mantenga bloqueados los .jar/.class de
# build/ en Windows entre ejecuciones (ForgeGradle reobfusca y reempaqueta el jar en cada build).
org.gradle.daemon=false